version: '3.8'

services:
  app:
    build:
      context: ./backend 
      dockerfile: Dockerfile
    container_name: PetCare-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - petcare-network

  webserver:
    image: nginx:alpine
    container_name: PetCare-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - petcare-network

  db:
    image: mysql:8.0
    container_name: PetCare-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: petcare_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: secret_password
      MYSQL_USER: PetCare_user
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - petcare-network

  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    container_name: petcare-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - petcare-network

networks:
  petcare-network:
    driver: bridge

volumes:
  dbdata:
    driver: local